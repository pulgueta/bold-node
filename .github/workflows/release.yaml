name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/setup

      # --- Quality gates: a broken SDK must never reach the registry ---
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      # The published tarball ships `dist/` (see package.json "files"). If the build
      # produced nothing, fail loudly here instead of publishing an empty package.
      - name: Verify build output
        run: |
          test -s dist/index.js || { echo "::error::dist/index.js is missing or empty after build"; exit 1; }
          test -s dist/index.d.ts || { echo "::error::dist/index.d.ts is missing or empty after build"; exit 1; }
          echo "Build output verified:"
          ls -la dist

      # semantic-release runs from the pinned devDependency (deterministic versions),
      # not a re-installed action copy. @semantic-release/npm runs `npm publish`, which
      # triggers the `prepack` script -> a fresh `pnpm build` -> guaranteed fresh dist.
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
